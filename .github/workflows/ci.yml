name: CI & Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test & Build Verification
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile production bundle
        run: npm run build

      - name: Run Hallmark design floor audit
        run: npm run lint:hallmark

      - name: Run test suite
        run: npm test

  package-linux:
    name: Package Linux Desktop Binary
    needs: verify
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile production bundle
        run: npm run build

      - name: Package Linux AppImage & deb
        run: npm run dist:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glimra-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  package-windows:
    name: Package Windows installer
    needs: verify
    runs-on: windows-2022
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Windows NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: glimra-windows-x64-unsigned
          path: release/*.exe
          if-no-files-found: error
